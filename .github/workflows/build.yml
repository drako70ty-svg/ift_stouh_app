
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
      
run: |
  echo "=== MANIFEST CONTENT ==="
  cat -n app/src/main/AndroidManifest.xml
  echo "=== XML VALIDATION ==="
  python3 -c "import xml.etree.ElementTree as E; E.parse('app/src/main/AndroidManifest.xml'); print('XML is valid')"
  gradle --no-daemon assembleDebug --stacktrace
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: IFT-Stouh-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
